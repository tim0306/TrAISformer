[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traisformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["traisformer*"]
exclude = ["data*", "figures*"]
